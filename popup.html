<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BidPolish</title>
<style>
  :root {
    --ink: #0E1521;
    --muted: #5B6675;
    --line: #D3D9E2;
    --field: #F4F6F9;
    --accent: #2F6F62;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 260px;
    padding: 14px 14px 16px;
    color: var(--ink);
    background: #fff;
    font: 13px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
  }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 12px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .label { font-weight: 500; }
  .hint { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  /* Simple switch */
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex: none;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #C9D0D9;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .15s ease;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .switch input:focus-visible + .slider {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .links {
    margin-top: 12px;
    display: flex;
    justify-content: flex-end;
  }
  a {
    color: var(--accent);
    font-size: 12.5px;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>BidPolish</h1>
  <p class="sub">Chat helpers</p>

  <div class="row">
    <div>
      <div class="label">Show chat buttons</div>
      <p class="hint">Hide the bar above the message box when you do not need it. Hotkeys still work.</p>
    </div>
    <label class="switch" title="Show or hide the chat buttons">
      <input id="showBar" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>

  <div class="links">
    <a id="options" href="#">Options</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
